[package]
name = "mixer"
version = "0.1.0"
edition = "2024"
description = "2-channel mixer example demonstrating rustjay-mixer"

[dependencies]
rustjay-engine = { workspace = true, features = ["mixer"] }
rustjay-mixer  = { workspace = true }
rustjay-render = { workspace = true }
rustjay-core   = { workspace = true }
wgpu           = { workspace = true }
bytemuck       = { workspace = true }
anyhow         = { workspace = true }
serde          = { workspace = true }
log            = { workspace = true }
env_logger     = "0.11"
imgui          = { workspace = true }

[features]
default = ["webcam"]
ndi     = ["rustjay-engine/ndi"]
webcam  = ["rustjay-engine/webcam"]

[target.'cfg(target_os = "macos")'.dependencies]
# Not used in code: a direct dependency is what makes syphon-core's
# `links = "Syphon"` metadata (DEP_SYPHON_FRAMEWORK_DIR) visible to build.rs,
# which needs it to emit the runtime rpath for the bundled Syphon.framework.
syphon-core = { workspace = true }
