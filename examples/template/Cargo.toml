[package]
name = "template"
version = "0.1.0"
edition = "2024"
description = "HSB color template — reference example for rustjay-engine"

[dependencies]
rustjay-engine = { workspace = true }
bytemuck       = { workspace = true }
serde          = { workspace = true }
anyhow         = { workspace = true }
log            = { workspace = true }
env_logger     = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# Not used in code: a direct dependency is what makes syphon-core's
# `links = "Syphon"` metadata (DEP_SYPHON_FRAMEWORK_DIR) visible to build.rs,
# which needs it to emit the runtime rpath for the bundled Syphon.framework.
syphon-core = { workspace = true }
objc = "0.2"

[features]
default = ["webcam"]
ndi     = ["rustjay-engine/ndi"]
webcam  = ["rustjay-engine/webcam"]
link    = ["rustjay-engine/link"]
prodj   = ["rustjay-engine/prodj"]
mtc     = ["rustjay-engine/mtc"]
