[package]
name = "rustjay-gui"
version = "0.1.0"
edition = "2024"
description = "ImGui control interface for rustjay-engine"
license = "MIT"
repository = "https://github.com/BlueJayLouche/rustjay-engine"
keywords = ["vj", "video", "imgui", "gui"]
categories = ["graphics", "gui"]

[dependencies]
rustjay-core    = { workspace = true }
rustjay-audio   = { workspace = true }
rustjay-io      = { workspace = true, default-features = false }
rustjay-control = { workspace = true }
rustjay-presets = { workspace = true }
log             = { workspace = true }
anyhow          = { workspace = true }
wgpu            = { workspace = true }
winit           = { workspace = true }
bytemuck        = { workspace = true }
imgui               = { workspace = true }
imgui-wgpu          = { workspace = true, optional = true }
imgui-winit-support = { workspace = true }
egui                = { workspace = true, optional = true }
egui-wgpu           = { workspace = true, optional = true }
egui-winit          = { workspace = true, optional = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
pollster        = { workspace = true }
qrcode          = { workspace = true }

[features]
default = []
# Dear ImGui renderer backend. Off by default: imgui-wgpu 0.28 (latest) requires
# wgpu 29, so it cannot coexist with the engine's wgpu 30. The `imgui` crate
# itself has no wgpu dependency, so imgui tabs build regardless of this flag.
imgui-renderer = ["dep:imgui-wgpu"]
ndi     = ["rustjay-core/ndi"]
egui    = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

link   = ["rustjay-core/link"]
prodj  = ["rustjay-core/prodj"]
mtc    = ["rustjay-control/mtc"]

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["snapshot", "wgpu"] }
