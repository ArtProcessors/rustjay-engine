[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

# Force Ninja generator so cmake (used by rusty_link/Ableton Link) never tries
# to auto-detect a Visual Studio generator. Without this, the cmake crate picks
# the generator based on the highest VS version installed; if that version is
# newer than the cmake.exe found on PATH the build fails (e.g. VS 2026 detected
# but only VS 2019's bundled cmake available).
[env]
CMAKE_GENERATOR = "Ninja"
# ...which costs optimization on MSVC: the cmake crate doesn't see a
# generator it chose, so it overwrites CMAKE_<LANG>_FLAGS_RELEASE with cc's
# flags minus every /O*, and shaderc (glslang + spirv-opt) builds at /Od —
# ~300 ms to transpile one ISF shader instead of ~40. cl.exe prepends $CL to
# every command line, so this puts /O2 back; an explicit /Od later still wins.
# Ignored off Windows. Not tracked by cargo: `cargo clean -p shaderc-sys`.
# Unforced on purpose: a CL already in your environment wins, and then this
# fix is off. It applies in every profile too, so a debuggable C++ dependency
# on Windows means building with CL cleared.
CL = "/O2"
